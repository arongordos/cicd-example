name: Build React
description: Install dependencies with npm cache, build the React static site, and upload the dist artifact.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Build
      run: npm run build
      shell: bash

    - name: Upload dist
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/
